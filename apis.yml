aid: stack-health
name: Stack Health
description: >-
  Stack Healthcare (stackhealthcare.com) is a health-insurance fintech offering
  affordable, flexible coverage for small businesses and their teams. Operating
  as a technology company rather than a bank, Stack acts as a HIPAA Business
  Associate to employer-sponsored health plans, processing Protected Health
  Information for enrollment and benefits administration, and partners with
  Stripe for payments and Celtic Bank for issuing commercial cards. The company
  was surfaced as a portfolio company of 8vc and added to the API Evangelist
  network. As of this enrichment pass Stack publishes no public API, developer
  portal, SDK, or documentation surface — the product is a waitlist-gated web
  application — so this profile captures the identity, security, and compliance
  posture that is publicly verifiable.
